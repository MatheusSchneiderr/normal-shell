[core]
plugins = \
  alpha \
  animate \
  autostart \
  command \
  decoration \
  expo \
  foreign-toplevel \
  grid \
  gtk-shell \
  ipc \
  ipc-rules \
  move \
  place \
  resize \
  scale \
  session-lock \
  shortcuts-inhibit \
  switcher \
  vswitch \
  window-rules \
  wm-actions \
  xdg-activation

close_top_view = <super> KEY_Q | <alt> KEY_F4
vwidth = 2
vheight = 2
preferred_decoration_mode = server

[input]
xkb_layout = br
xkb_variant = abnt2
kb_repeat_rate = 25
kb_repeat_delay = 300
natural_scroll = true
tap_to_click = true
disable_touchpad_while_typing = true
cursor_theme = WhiteSur-cursors
cursor_size = 24

[output:eDP-1]
mode = 2880x1800@60001
position = 0,0
scale = 1.5

[autostart]
autostart_wf_shell = false
0_session = sh -c 'dbus-update-activation-environment --systemd --all && systemctl --user --no-block start wayfire-session.target'
2_panel = env QT_QUICK_BACKEND=software QS_ICON_THEME=Papirus-Dark quickshell -c panel

[command]
binding_terminal = <super> KEY_ENTER
command_terminal = foot
binding_files = <super> KEY_E
command_files = thunar
binding_start = <super>
command_start = quickshell -c panel ipc call start toggle
binding_start_alt = <alt> KEY_F1
command_start_alt = quickshell -c panel ipc call start toggle
binding_launcher = <super> KEY_ESC
command_launcher = quickshell -c panel ipc call launcher toggle
binding_power = KEY_POWER
command_power = quickshell -c panel ipc call start power
binding_clipboard = <super> KEY_V
command_clipboard = quickshell -c panel ipc call popup toggle clipboard
binding_focus_left = <super> KEY_H
command_focus_left = lua @home@/.config/wayfire/edge-focus.lua left
binding_focus_down = <super> KEY_J
command_focus_down = lua @home@/.config/wayfire/edge-focus.lua down
binding_focus_up = <super> KEY_K
command_focus_up = lua @home@/.config/wayfire/edge-focus.lua up
binding_focus_right = <super> KEY_L
command_focus_right = lua @home@/.config/wayfire/edge-focus.lua right
binding_send_left = <super> <alt> KEY_H
command_send_left = lua @home@/.config/wayfire/edge-focus.lua send left
binding_send_down = <super> <alt> KEY_J
command_send_down = lua @home@/.config/wayfire/edge-focus.lua send down
binding_send_up = <super> <alt> KEY_K
command_send_up = lua @home@/.config/wayfire/edge-focus.lua send up
binding_send_right = <super> <alt> KEY_L
command_send_right = lua @home@/.config/wayfire/edge-focus.lua send right
binding_notifications = <super> KEY_N
command_notifications = quickshell -c panel ipc call popup toggle notifications
binding_settings = <super> KEY_I
command_settings = quickshell -c panel ipc call settings toggle
repeatable_binding_move_left = <super> <shift> KEY_H
command_move_left = lua @home@/.config/wayfire/window.lua move left
repeatable_binding_move_down = <super> <shift> KEY_J
command_move_down = lua @home@/.config/wayfire/window.lua move down
repeatable_binding_move_up = <super> <shift> KEY_K
command_move_up = lua @home@/.config/wayfire/window.lua move up
repeatable_binding_move_right = <super> <shift> KEY_L
command_move_right = lua @home@/.config/wayfire/window.lua move right
binding_pin = <super> KEY_S
command_pin = lua @home@/.config/wayfire/window.lua pin
binding_resize = <super> KEY_R
command_resize = quickshell -c panel ipc call resize toggle
binding_lock = <super> <alt> KEY_ESC
command_lock = quickshell -c panel ipc call lock lock
binding_screenshot = KEY_SYSRQ | KEY_PRINT
command_screenshot = quickshell -c panel ipc call screenshot region
binding_screenshot_full = <super> KEY_SYSRQ | <super> KEY_PRINT
command_screenshot_full = quickshell -c panel ipc call screenshot full
repeatable_binding_volume_up = KEY_VOLUMEUP
command_volume_up = wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
repeatable_binding_volume_down = KEY_VOLUMEDOWN
command_volume_down = wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
binding_mute = KEY_MUTE
command_mute = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
repeatable_binding_light_up = KEY_BRIGHTNESSUP
command_light_up = brightnessctl set 5%+
repeatable_binding_light_down = KEY_BRIGHTNESSDOWN
command_light_down = brightnessctl set 5%-

[wm-actions]
toggle_fullscreen = <super> KEY_F
toggle_maximize = <super> KEY_M
toggle_showdesktop = <super> KEY_D

[grid]
slot_l = <super> KEY_LEFT
slot_r = <super> KEY_RIGHT
slot_c = <super> KEY_UP
restore = <super> KEY_DOWN

[switcher]
next_view = <alt> KEY_TAB
prev_view = <alt> <shift> KEY_TAB

[scale]
toggle = <super> KEY_W | <super> KEY_TAB

[expo]
toggle = <super> KEY_G

[vswitch]
duration = 0
binding_left = <ctrl> <super> KEY_LEFT
binding_right = <ctrl> <super> KEY_RIGHT
binding_up = <ctrl> <super> KEY_UP
binding_down = <ctrl> <super> KEY_DOWN
with_win_left = <ctrl> <super> <shift> KEY_LEFT
with_win_right = <ctrl> <super> <shift> KEY_RIGHT
with_win_up = <ctrl> <super> <shift> KEY_UP
with_win_down = <ctrl> <super> <shift> KEY_DOWN
binding_1 = <ctrl> KEY_1
binding_2 = <ctrl> KEY_2
binding_3 = <ctrl> KEY_3
binding_4 = <ctrl> KEY_4
send_win_1 = <alt> KEY_1
send_win_2 = <alt> KEY_2
send_win_3 = <alt> KEY_3
send_win_4 = <alt> KEY_4

[move]
activate = <super> BTN_LEFT

[resize]
activate = <super> BTN_RIGHT

[decoration]
font = monospace
font_color = \#d8d8d8ff
title_height = 24
border_size = 2
button_order = minimize maximize close
active_color = \#282828ff
inactive_color = \#181818ff

[animate]
open_animation = fade
close_animation = fade
duration = 150

[window-rules]
big = on created if floating is true then set geometry_ppt 4 4 92 86
